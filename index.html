<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>退休航道 · ETF 退休規劃</title>
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.webmanifest">

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.5/purify.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<link rel="stylesheet" href="styles/app.css">
</head>
<body class="locked">
<script>
/* 有既有密碼時，在首屏前解除鎖定，避免已登入者閃一下模糊層 */
(function () {
  try {
    if (localStorage.getItem('appAuth')) document.body.classList.remove('locked');
  } catch (_) {}
})();
</script>

<header class="appbar">
  <div class="brand">
    <div>退休航道<small>ETF 歷史回測 × AI 退休規劃</small></div>
  </div>
  <div class="plan-chip" id="planChip">—</div>
  <div class="spacer"></div>
  <button class="icon-btn" title="切換深色模式">🌓</button>
  <button class="icon-btn" id="advisorToggle">💬 退休顧問</button>
</header>

<div class="shell">
  <!-- ===== 主區 ~2/3：圖表、指標、組合與假設 ===== -->
  <main class="dash">
    <div class="above-tabs">
    <section class="workspace">
      <section class="card portfolio-card">
        <h3 class="card-title">📦 ETF 組合權重 <span class="hint" id="weightSum"></span></h3>
        <div id="portfolioName" hidden></div>
        <div id="holdings"></div>
        <div class="row" style="margin-top: 4px;">
          <button class="btn">＋ 新增 ETF</button>
          <span class="spacer"></span>
          <div class="input-wrap" style="height: 34px; width: 130px;">
            <select id="rebalance" title="再平衡頻率"></select>
          </div>
        </div>
        <details class="adv">
          <summary>進階：限定回測期間</summary>
          <div class="plan-grid">
            <div class="field"><label for="btStart">起始日</label><div class="input-wrap"><input type="date" id="btStart"></div></div>
            <div class="field"><label for="btEnd">結束日</label><div class="input-wrap"><input type="date" id="btEnd"></div></div>
          </div>
          <div class="small muted" style="margin-top: 6px;">留空 = 用所有資產共同可用的最長歷史（退休模擬越長越好）。</div>
        </details>
      </section>

      <section class="card plan-card">
        <h3 class="card-title">🎯 退休計劃假設 <span class="hint">今日幣值</span></h3>
        <div class="plan-grid" id="planForm"></div>
        <div class="timeline" id="planTimeline"><div class="acc"></div><div class="ret"></div></div>
        <div class="timeline-labels" id="planTimelineLabels"></div>
      </section>
    </section>

    <div class="kpi-secondary" hidden>
      <span>退休時資產（中位）<b id="kpiRetire">—</b><span id="kpiRetireSub"></span><span class="delta" id="kpiRetireDelta"></span></span>
      <span>可持續年支出（95%）<b id="kpiSpendAnnual">—</b></span>
    </div>

    <section class="card">
      <h3 class="card-title">📈 資產軌跡 <span class="hint" id="fanHint"></span></h3>
      <div class="chart-box"><canvas id="fanChart"></canvas></div>
      <div class="legend-note" id="fanNote" hidden></div>
    </section>

    <div class="calc-bar">
      <button class="btn primary block" id="calcBtn">重新計算</button>
      <div class="status" id="status"></div>
    </div>
    </div>

    <section class="card results-card">
      <div class="tabs" id="tabs">
        <button data-tab="overview" class="on">概況</button>
        <button data-tab="scenarios">歷史情境</button>
        <button data-tab="performance">組合績效</button>
        <button data-tab="assets">資產明細</button>
      </div>
      <div class="tab-panel" id="tab-overview">
        <dl class="overview-facts" id="kpis">
          <div>
            <dt>歷史成功率</dt>
            <dd id="kpiSuccess">—</dd>
            <dd class="overview-extra" id="sampleWarning" hidden></dd>
            <dd class="delta" id="kpiSuccessDelta"></dd>
          </div>
          <div>
            <dt>每月可花金額</dt>
            <dd id="kpiSpend">—</dd>
            <dd class="delta" id="kpiSpendDelta"></dd>
          </div>
          <div>
            <dt>初始提領率</dt>
            <dd id="kpiWithdraw">—</dd>
            <dd class="overview-extra"><b id="kpiSwr">—</b> SWR · <b id="kpiPwr">—</b> PWR</dd>
            <dd class="delta" id="kpiWithdrawDelta"></dd>
          </div>
          <div>
            <dt id="kpiYieldLabel">所需報酬（名目）</dt>
            <dd class="phase-rates" id="kpiYield">—</dd>
            <dd class="delta" id="kpiYieldDelta"></dd>
          </div>
        </dl>
        <p class="path-highlights" id="pathHighlights" hidden></p>
        <button type="button" class="btn" id="exportPaths" hidden>匯出全部路徑 CSV</button>
        <div id="pathViewer" hidden></div>
        <p class="path-highlights" id="inflationLabel" hidden></p>
        <p class="path-highlights" id="glideHighlight" hidden></p>
        <p class="path-highlights" id="taxDragHighlight" hidden></p>
        <p class="path-highlights" id="dividendHighlight" hidden></p>
        <p class="path-highlights" id="cashHighlight" hidden></p>
        <p class="path-highlights" id="feeHighlight" hidden></p>
        <p class="path-highlights" id="fxHighlight" hidden></p>
        <p class="path-highlights" id="bootstrapHighlight" hidden></p>
        <p class="path-highlights" id="frequencyHighlight" hidden></p>
      </div>
      <div class="tab-panel" id="tab-scenarios" hidden></div>
      <div class="tab-panel" id="tab-performance" hidden></div>
      <div class="tab-panel" id="tab-assets" hidden></div>
    </section>
  </main>

  <!-- ===== 右 ~1/3：AI 對話 ===== -->
  <section class="advisor">
    <div class="adv-head">
      <div class="adv-toolbar">
        <button type="button" class="adv-settings-toggle" id="advSettingsToggle" aria-expanded="false" aria-controls="advSettingsPanel" title="對話與模型">
          <span id="advSettingsSummary">對話 · 模型</span>
          <span class="adv-chevron" aria-hidden="true">▾</span>
        </button>
        <button class="icon-btn" id="advisorClose" title="關閉" style="display: none;">✕</button>
      </div>
      <div class="adv-settings" id="advSettingsPanel" hidden>
        <div class="adv-controls">
          <select id="convSelect" title="對話"></select>
          <button class="icon-btn" title="新對話">＋</button>
          <div id="convMenu">
            <button class="icon-btn" title="更多">⋯</button>
          </div>
        </div>
        <div class="adv-controls">
          <select id="modelSelect" title="AI 模型"></select>
        </div>
      </div>
    </div>
    <div id="messages"></div>
    <div class="composer">
      <div class="composer-box">
        <textarea id="inputBox" rows="1" placeholder="問問你的退休顧問…"></textarea>
        <button id="sendBtn">送出</button>
      </div>
    </div>
  </section>
</div>

<datalist id="symbolList"></datalist>

<div id="authOverlay" hidden role="dialog" aria-modal="true" aria-labelledby="authTitle">
  <div class="authBox" role="document">
    <h3 id="authTitle">輸入密碼</h3>
    <input type="password" id="authInput" placeholder="輸入密碼" autocomplete="current-password" aria-required="true" aria-describedby="authError">
    <div id="authError" role="alert" aria-live="assertive"></div>
    <button class="btn primary" id="authSubmitBtn" type="button">解鎖</button>
  </div>
</div>
<script>
/* 未登入：立刻顯示密碼框（此時 body 仍為 locked） */
if (document.body.classList.contains('locked')) {
  document.getElementById('authOverlay').hidden = false;
}
</script>
<script type="module" src="js/app.js"></script>
</body>
</html>
