<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>退休航道 · ETF 退休規劃</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.5/purify.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script type="module">
import * as engine from './backtest/engine.js';
import * as retirement from './backtest/retirement.js';
window.RP_MODULES = { engine, retirement };
window.dispatchEvent(new Event('rp-modules-ready'));
</script>

<style>
  * { box-sizing: border-box; }
  :root {
    --bg: #f3f5f9; --surface: #ffffff; --surface-2: #f7f8fb; --border: #e3e7ef;
    --text: #18202f; --muted: #6b7485; --faint: #9aa3b2;
    --accent: #4f46e5; --accent-2: #0ea5e9; --accent-soft: rgba(79, 70, 229, 0.10);
    --good: #059669; --warn: #d97706; --bad: #dc2626;
    --good-soft: rgba(5, 150, 105, 0.12); --warn-soft: rgba(217, 119, 6, 0.12); --bad-soft: rgba(220, 38, 38, 0.12);
    --shadow: 0 1px 2px rgba(16, 24, 40, 0.04), 0 4px 16px rgba(16, 24, 40, 0.06);
    --radius: 16px; --code-bg: #282c34;
  }
  body.dark {
    --bg: #0d1117; --surface: #151b24; --surface-2: #1b2230; --border: #263041;
    --text: #e6eaf2; --muted: #98a2b3; --faint: #6b7485;
    --accent: #818cf8; --accent-2: #38bdf8; --accent-soft: rgba(129, 140, 248, 0.14);
    --good: #34d399; --warn: #fbbf24; --bad: #f87171;
    --good-soft: rgba(52, 211, 153, 0.14); --warn-soft: rgba(251, 191, 36, 0.14); --bad-soft: rgba(248, 113, 113, 0.14);
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 4px 16px rgba(0, 0, 0, 0.25);
  }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 -apple-system, "Segoe UI", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif; display: flex; flex-direction: column; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }

  /* ===== App bar ===== */
  .appbar { display: flex; align-items: center; gap: 14px; padding: 10px 20px; background: var(--surface); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 20; }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 17px; letter-spacing: 0.02em; white-space: nowrap; }
  .brand-mark { width: 30px; height: 30px; border-radius: 9px; background: linear-gradient(135deg, var(--accent), var(--accent-2)); display: grid; place-items: center; color: #fff; font-size: 16px; }
  .brand small { display: block; font-weight: 500; font-size: 11px; color: var(--muted); letter-spacing: 0; }
  .plan-chip { padding: 6px 12px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); font-size: 12.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .spacer { flex: 1; }
  .icon-btn { border: 1px solid var(--border); background: var(--surface); border-radius: 10px; height: 34px; min-width: 34px; padding: 0 10px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; font-size: 13px; }
  .icon-btn:hover { background: var(--surface-2); }
  #advisorToggle { display: none; }

  /* ===== Auth overlay ===== */
  #authOverlay { position: fixed; inset: 0; background: rgba(15, 23, 42, 0.45); display: flex; align-items: center; justify-content: center; z-index: 100; backdrop-filter: blur(4px); }
  #authOverlay[hidden] { display: none; }
  .authBox { background: var(--surface); color: var(--text); padding: 24px; border-radius: 16px; width: min(380px, calc(100vw - 32px)); display: flex; flex-direction: column; gap: 10px; box-shadow: var(--shadow); border: 1px solid var(--border); }
  .authBox h3 { margin: 0; font-size: 16px; }
  .authBox p { margin: 0; font-size: 13px; color: var(--muted); }
  .authBox input { padding: 10px 12px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface-2); color: var(--text); font-size: 14px; outline: none; }
  .authBox input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  #authError { color: var(--bad); font-size: 12px; min-height: 16px; }

  /* ===== Shell ===== */
  .shell { flex: 1; min-height: 0; display: grid; grid-template-columns: 340px minmax(0, 1fr) 420px; }
  .setup { border-right: 1px solid var(--border); overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 14px; background: var(--bg); }
  .dash { overflow-y: auto; padding: 18px 20px 28px; display: flex; flex-direction: column; gap: 16px; min-width: 0; }
  .advisor { border-left: 1px solid var(--border); background: var(--surface); display: flex; flex-direction: column; min-height: 0; }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px; }
  .card-title { display: flex; align-items: center; gap: 8px; margin: 0 0 12px; font-size: 14.5px; font-weight: 700; }
  .card-title .hint { margin-left: auto; font-size: 12px; font-weight: 500; color: var(--muted); }
  .muted { color: var(--muted); }
  .small { font-size: 12px; }

  /* ===== Plan form ===== */
  .plan-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 12px; }
  .field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .field.wide { grid-column: 1 / -1; }
  .field label { font-size: 12px; color: var(--muted); }
  .input-wrap { display: flex; align-items: center; border: 1px solid var(--border); border-radius: 10px; background: var(--surface-2); padding: 0 10px; height: 36px; }
  .input-wrap:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .input-wrap input, .input-wrap select { flex: 1; min-width: 0; border: none; outline: none; background: transparent; height: 100%; }
  .input-wrap .unit { font-size: 12px; color: var(--faint); margin-left: 6px; white-space: nowrap; }
  .seg { display: flex; background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px; padding: 3px; gap: 3px; }
  .seg button { flex: 1; border: none; background: transparent; border-radius: 8px; padding: 6px 8px; font-size: 12.5px; color: var(--muted); }
  .seg button.on { background: var(--surface); color: var(--text); font-weight: 600; box-shadow: var(--shadow); }
  .timeline { margin-top: 12px; height: 8px; border-radius: 999px; background: var(--surface-2); display: flex; overflow: hidden; border: 1px solid var(--border); }
  .timeline .acc { background: linear-gradient(90deg, var(--accent-2), var(--accent)); }
  .timeline .ret { background: linear-gradient(90deg, #f59e0b, #ef4444); opacity: 0.75; }
  .timeline-labels { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); margin-top: 4px; }

  /* ===== Portfolio editor ===== */
  .holding { display: grid; grid-template-columns: minmax(0, 1fr) 76px 26px; gap: 6px; align-items: center; margin-bottom: 8px; }
  .holding .bar { grid-column: 1 / -1; height: 4px; border-radius: 999px; background: var(--surface-2); overflow: hidden; margin-top: -4px; }
  .holding .bar span { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent-2)); }
  .holding input { width: 100%; border: 1px solid var(--border); background: var(--surface-2); border-radius: 9px; height: 34px; padding: 0 9px; outline: none; }
  .holding input:focus { border-color: var(--accent); }
  .holding .sym { text-transform: uppercase; font-weight: 600; }
  .holding .w { text-align: right; }
  .x-btn { border: none; background: none; color: var(--faint); font-size: 15px; border-radius: 6px; height: 26px; }
  .x-btn:hover { color: var(--bad); background: var(--bad-soft); }
  .row { display: flex; align-items: center; gap: 8px; }
  .btn { border: 1px solid var(--border); background: var(--surface); border-radius: 10px; padding: 8px 12px; font-size: 13px; }
  .btn:hover { background: var(--surface-2); }
  .btn.primary { border: none; background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #fff; font-weight: 600; box-shadow: 0 6px 16px rgba(79, 70, 229, 0.25); }
  .btn.primary:hover { filter: brightness(1.06); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn.block { width: 100%; padding: 12px; font-size: 14px; }
  details.adv summary { cursor: pointer; font-size: 12.5px; color: var(--muted); margin: 6px 0; }
  .calc-bar { position: sticky; bottom: 0; padding-top: 4px; background: linear-gradient(transparent, var(--bg) 30%); }
  .status { font-size: 12px; color: var(--muted); min-height: 18px; margin-top: 6px; text-align: center; }
  .status.error { color: var(--bad); }

  /* ===== KPIs ===== */
  .kpis { display: grid; grid-template-columns: 1.25fr 1fr 1fr 1fr; gap: 14px; }
  .kpi { position: relative; overflow: hidden; }
  .kpi .label { font-size: 12.5px; color: var(--muted); font-weight: 600; }
  .kpi .value { font-size: 26px; font-weight: 750; letter-spacing: -0.01em; margin-top: 6px; line-height: 1.15; }
  .kpi .sub { font-size: 12px; color: var(--muted); margin-top: 6px; }
  .kpi .delta { font-size: 12px; font-weight: 600; margin-top: 4px; }
  .delta.up { color: var(--good); } .delta.down { color: var(--bad); }
  .kpi-hero { display: flex; gap: 16px; align-items: center; background: linear-gradient(135deg, var(--accent-soft), transparent 70%), var(--surface); }
  .ring { width: 112px; height: 112px; flex-shrink: 0; }
  .ring circle { fill: none; stroke-width: 11; }
  .ring .track { stroke: var(--surface-2); }
  .ring .meter { stroke-linecap: round; transform: rotate(-90deg); transform-origin: 50% 50%; transition: stroke-dashoffset 0.6s ease; }
  .ring text { font-size: 22px; font-weight: 800; fill: var(--text); }
  .ring .ring-sub { font-size: 10px; font-weight: 600; fill: var(--muted); }
  .pill { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 11.5px; font-weight: 700; }
  .pill.good { background: var(--good-soft); color: var(--good); }
  .pill.warn { background: var(--warn-soft); color: var(--warn); }
  .pill.bad { background: var(--bad-soft); color: var(--bad); }

  .chart-box { position: relative; height: 320px; }
  .chart-box.short { height: 260px; }
  .legend-note { font-size: 12px; color: var(--muted); margin-top: 8px; }

  /* ===== Tabs ===== */
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin: -4px -4px 14px; padding: 0 4px; }
  .tabs button { border: none; background: none; padding: 10px 12px; font-size: 13.5px; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; }
  .tabs button.on { color: var(--accent); border-bottom-color: var(--accent); font-weight: 700; }
  .tab-panel[hidden] { display: none; }
  .stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 14px; }
  .stat { background: var(--surface-2); border: 1px solid var(--border); border-radius: 12px; padding: 10px 12px; }
  .stat .k { font-size: 11.5px; color: var(--muted); }
  .stat .v { font-size: 17px; font-weight: 700; margin-top: 2px; }
  .stat .p { font-size: 11px; color: var(--faint); }
  .neg { color: var(--bad); }
  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  table.tbl { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  .tbl th { text-align: right; font-weight: 600; color: var(--muted); padding: 6px 8px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  .tbl td { text-align: right; padding: 6px 8px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  .tbl th:first-child, .tbl td:first-child { text-align: left; }
  .tbl-wrap { overflow-x: auto; }
  .heat td { text-align: center; font-variant-numeric: tabular-nums; }
  .warn-list { margin: 10px 0 0; padding-left: 18px; color: var(--warn); font-size: 12.5px; }
  .section-h { font-size: 13px; font-weight: 700; margin: 16px 0 8px; }
  .toggle-line { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
  .toggle-line label { font-size: 12.5px; color: var(--muted); display: inline-flex; gap: 6px; align-items: center; }
  .empty { padding: 40px 20px; text-align: center; color: var(--muted); }

  /* ===== Advisor ===== */
  .adv-head { padding: 12px 14px; border-bottom: 1px solid var(--border); display: flex; flex-direction: column; gap: 8px; }
  .adv-title { display: flex; align-items: center; gap: 10px; }
  .adv-title .avatar { width: 32px; height: 32px; border-radius: 50%; background: linear-gradient(135deg, var(--accent-2), var(--accent)); display: grid; place-items: center; color: #fff; font-size: 15px; }
  .adv-title b { font-size: 14.5px; }
  .adv-title .muted { font-size: 11.5px; display: block; }
  .adv-controls { display: flex; gap: 6px; }
  .adv-controls select { flex: 1; min-width: 0; height: 32px; border: 1px solid var(--border); border-radius: 9px; background: var(--surface-2); padding: 0 8px; font-size: 12.5px; }
  .adv-controls .icon-btn { height: 32px; min-width: 32px; padding: 0 8px; }
  #convMenu { position: relative; }
  .menu { position: absolute; right: 0; top: 36px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; box-shadow: var(--shadow); z-index: 30; min-width: 140px; overflow: hidden; }
  .menu button { display: block; width: 100%; text-align: left; border: none; background: none; padding: 9px 14px; font-size: 13px; }
  .menu button:hover { background: var(--surface-2); }
  .menu button.danger { color: var(--bad); }

  #messages { flex: 1; overflow-y: auto; padding: 16px 14px; display: flex; flex-direction: column; gap: 14px; }
  .msg { display: flex; flex-direction: column; max-width: 100%; }
  .msg.user { align-items: flex-end; }
  .bubble { padding: 10px 13px; border-radius: 14px; line-height: 1.6; word-break: break-word; max-width: 100%; }
  .msg.user .bubble { background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #fff; border-bottom-right-radius: 4px; white-space: pre-wrap; max-width: 88%; }
  .msg.bot .bubble { background: var(--surface-2); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
  .msg.error .bubble { background: var(--bad-soft); color: var(--bad); }
  .bubble p { margin: 0 0 8px; } .bubble p:last-child { margin-bottom: 0; }
  .bubble ul, .bubble ol { margin: 4px 0 8px 18px; padding: 0; }
  .bubble h1, .bubble h2, .bubble h3 { font-size: 14.5px; margin: 12px 0 6px; }
  .bubble table { border-collapse: collapse; margin: 8px 0; font-size: 12.5px; display: block; overflow-x: auto; }
  .bubble th, .bubble td { border: 1px solid var(--border); padding: 4px 8px; }
  .bubble code { font-family: "Cascadia Code", Consolas, monospace; font-size: 12.5px; }
  .code-box { margin: 8px 0; border-radius: 8px; overflow: hidden; background: var(--code-bg); }
  .code-head { display: flex; justify-content: space-between; padding: 4px 10px; font-size: 11.5px; color: #abb2bf; background: rgba(0, 0, 0, 0.3); font-family: monospace; }
  .code-head button { border: none; background: none; color: #abb2bf; font-size: 11.5px; }
  .bubble pre { margin: 0; padding: 10px; overflow-x: auto; background: var(--code-bg); }
  .msg-meta { display: flex; gap: 8px; align-items: center; margin-top: 4px; font-size: 11px; color: var(--faint); }
  .msg-meta button { border: none; background: none; color: var(--faint); font-size: 11px; padding: 1px 4px; border-radius: 4px; }
  .msg-meta button:hover { color: var(--text); background: var(--surface-2); }
  .attach-tag { margin-top: 4px; font-size: 11px; color: var(--muted); }
  details.debug { font-size: 11.5px; color: var(--muted); margin-top: 4px; }
  details.debug pre { white-space: pre-wrap; background: var(--code-bg); color: #abb2bf; padding: 8px; border-radius: 6px; }

  .action-card { border: 1px solid var(--accent); background: var(--surface); border-radius: 12px; padding: 10px 12px; margin: 10px 0; }
  .action-card.plan { border-color: var(--accent-2); }
  .action-card .ac-title { font-weight: 700; margin-bottom: 6px; display: flex; gap: 6px; align-items: center; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
  .chip { background: var(--surface-2); border: 1px solid var(--border); border-radius: 999px; padding: 2px 9px; font-size: 12px; }
  .ac-meta { font-size: 12px; color: var(--muted); margin-bottom: 8px; }
  .ac-actions { display: flex; gap: 6px; flex-wrap: wrap; }
  .ac-actions .btn { padding: 6px 10px; font-size: 12.5px; }

  .welcome { text-align: center; padding: 18px 8px; color: var(--muted); }
  .welcome h3 { color: var(--text); margin: 8px 0 4px; font-size: 15px; }
  .quick { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-top: 12px; }
  .quick button { border: 1px solid var(--border); background: var(--surface-2); border-radius: 999px; padding: 6px 11px; font-size: 12.5px; }
  .quick button:hover { border-color: var(--accent); color: var(--accent); }

  .composer { border-top: 1px solid var(--border); padding: 10px 12px 12px; }
  .composer-box { display: flex; align-items: flex-end; gap: 6px; border: 1px solid var(--border); border-radius: 14px; background: var(--surface-2); padding: 6px; }
  .composer-box:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  #inputBox { flex: 1; border: none; outline: none; background: transparent; resize: none; max-height: 160px; padding: 6px 4px; min-height: 22px; }
  #sendBtn { border: none; border-radius: 10px; height: 34px; padding: 0 14px; background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #fff; font-weight: 600; }
  #sendBtn:disabled { opacity: 0.5; }
  #attachBtn { border: none; background: none; height: 34px; width: 32px; border-radius: 8px; font-size: 16px; color: var(--muted); }
  #attachBtn:hover { background: var(--surface); }
  #attachPreview { font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  #attachPreview button { border: none; background: none; color: var(--muted); }
  .ctx-note { font-size: 11px; color: var(--faint); margin-top: 6px; text-align: center; }

  /* ===== Responsive ===== */
  @media (max-width: 1400px) { .shell { grid-template-columns: 320px minmax(0, 1fr) 380px; } .kpis { grid-template-columns: 1fr 1fr; } }
  @media (max-width: 1100px) {
    .shell { grid-template-columns: 1fr; overflow-y: auto; }
    .setup { border-right: none; overflow: visible; }
    .dash { overflow: visible; padding-top: 0; }
    .advisor { position: fixed; inset: 0 0 0 auto; width: min(440px, 100%); z-index: 40; transform: translateX(100%); transition: transform 0.25s ease; box-shadow: -10px 0 30px rgba(0, 0, 0, 0.2); }
    body.advisor-open .advisor { transform: none; }
    #advisorToggle { display: inline-flex; }
    .calc-bar { position: static; }
    .plan-chip { display: none; }
  }
  @media (max-width: 640px) {
    .kpis, .stat-grid, .two-col { grid-template-columns: 1fr 1fr; }
    .kpi-hero { grid-column: 1 / -1; }
    .appbar { padding: 8px 12px; gap: 8px; }
    .brand small { display: none; }
    .dash { padding: 0 12px 20px; } .setup { padding: 12px; }
    .chart-box { height: 260px; }
  }
</style>
</head>
<body>

<header class="appbar">
  <div class="brand">
    <div class="brand-mark">◐</div>
    <div>退休航道<small>ETF 歷史回測 × AI 退休規劃</small></div>
  </div>
  <div class="plan-chip" id="planChip">—</div>
  <div class="spacer"></div>
  <button class="icon-btn" onclick="showAuthDialog()" title="更換存取密碼">🔑</button>
  <button class="icon-btn" onclick="toggleTheme()" title="切換深色模式">🌓</button>
  <button class="icon-btn" id="advisorToggle" onclick="toggleAdvisor()">💬 AI 顧問</button>
</header>

<div class="shell">
  <!-- ===== 左：計劃與組合設定 ===== -->
  <aside class="setup">
    <section class="card">
      <h3 class="card-title">🎯 我的退休計劃 <span class="hint">今日幣值</span></h3>
      <div class="plan-grid" id="planForm"></div>
      <div class="timeline" id="planTimeline"><div class="acc"></div><div class="ret"></div></div>
      <div class="timeline-labels" id="planTimelineLabels"></div>
    </section>

    <section class="card">
      <h3 class="card-title">📦 ETF 組合 <span class="hint" id="weightSum"></span></h3>
      <div class="small muted" id="portfolioName" style="margin: -6px 0 10px;"></div>
      <div id="holdings"></div>
      <div class="row" style="margin-top: 4px;">
        <button class="btn" onclick="addHoldingRow('', '')">＋ 新增 ETF</button>
        <span class="spacer"></span>
        <div class="input-wrap" style="height: 34px; width: 130px;">
          <select id="rebalance" title="再平衡頻率"></select>
        </div>
      </div>
      <details class="adv">
        <summary>進階：限定回測期間</summary>
        <div class="plan-grid">
          <div class="field"><label for="btStart">起始日</label><div class="input-wrap"><input type="date" id="btStart"></div></div>
          <div class="field"><label for="btEnd">結束日</label><div class="input-wrap"><input type="date" id="btEnd"></div></div>
        </div>
        <div class="small muted" style="margin-top: 6px;">留空 = 用所有資產共同可用的最長歷史（退休模擬越長越好）。</div>

<datalist id="symbolList"></datalist>

<div id="authOverlay" hidden>
  <div class="authBox">
    <h3>輸入存取密碼</h3>
    <p>密碼只存在這個瀏覽器（localStorage），不會寫進網頁原始碼。</p>
    <input type="password" id="authInput" placeholder="存取密碼" autocomplete="current-password">
    <div id="authError"></div>
    <button class="btn primary" id="authSubmitBtn" onclick="submitAuth()">確定</button>
  </div>
</div>

<script>
// ============================================================
// 設定
// ============================================================
const WORKER_URL = ['localhost', '127.0.0.1'].includes(location.hostname)
  ? 'http://127.0.0.1:8787/'
  : 'https://etf-backtest-worker.davchan-clp.workers.dev/';
const AUTH_STORAGE_KEY = 'appAuth';

const STORE = {
  plan: 'rp.plan', portfolio: 'rp.portfolio', conversations: 'rp.conversations',
  activeConv: 'rp.activeConv', theme: 'rp.theme', tab: 'rp.tab', logScale: 'rp.logScale'
};

function getAuth() {
  return localStorage.getItem(AUTH_STORAGE_KEY) || '';
}

function showAuthDialog(message) {
  $('authError').textContent = message || '';
  $('authOverlay').hidden = false;
  const input = $('authInput');
  input.value = '';
  input.focus();
}

async function submitAuth() {
  const input = $('authInput');
  const errorEl = $('authError');
  const btn = $('authSubmitBtn');
  const password = input.value.trim();
  if (!password) return;
  btn.disabled = true;
  errorEl.textContent = '驗證中…';
  try {
    const res = await fetch(`${WORKER_URL}api/auth-check`, { headers: { 'X-App-Auth': password } });
    if (res.status === 401) { errorEl.textContent = '密碼錯誤'; return; }
    if (!res.ok) throw new Error('HTTP ' + res.status);
    localStorage.setItem(AUTH_STORAGE_KEY, password);
    $('authOverlay').hidden = true;
  } catch (e) {
    errorEl.textContent = '無法連線到 Worker：' + e.message;
  } finally {
    btn.disabled = false;
  }
}

function handleUnauthorized() {
  localStorage.removeItem(AUTH_STORAGE_KEY);
  showAuthDialog('密碼已失效，請重新輸入。');
}

const REBALANCE_LABELS = { annual: '每年再平衡', semiannual: '每半年', quarterly: '每季', monthly: '每月', none: '不再平衡' };
const DEFAULT_PORTFOLIO = { name: '起始組合：股債 60/40', holdings: { VTI: 60, IEF: 40 }, rebalance: 'annual', start: '', end: '' };
const CURRENCIES = ['HKD', 'USD', 'TWD', 'CNY', 'SGD', 'EUR', 'GBP', 'JPY', 'AUD', 'CAD'];

const PLAN_FIELDS = [
  { key: 'currentAge', label: '目前年齡', unit: '歲', step: 1 },
  { key: 'retireAge', label: '退休年齡', unit: '歲', step: 1 },
  { key: 'endAge', label: '規劃至', unit: '歲', step: 1 },
  { key: 'currency', label: '幣別', type: 'currency' },
  { key: 'currentSavings', label: '現有投資資產', unit: '', step: 10000, money: true, wide: true },
  { key: 'monthlyContribution', label: '每月投入（至退休）', unit: '/月', step: 1000, money: true, wide: true },
  { key: 'annualSpending', label: '退休後每年支出', unit: '/年', step: 10000, money: true, wide: true },
  { key: 'otherIncome', label: '其他退休收入', unit: '/年', step: 10000, money: true },
  { key: 'otherIncomeAge', label: '收入起始年齡', unit: '歲', step: 1 },
  { key: 'inflationMode', label: '通膨來源', type: 'inflation', wide: true },
  { key: 'inflationRate', label: '通膨假設', unit: '%/年', step: 0.1 },
  { key: 'feeRate', label: '費用＋成本', unit: '%/年', step: 0.05 }
];
const PLAN_LABELS = Object.fromEntries(PLAN_FIELDS.map(f => [f.key, f.label]));

// ============================================================
// 小工具
// ============================================================
const $ = id => document.getElementById(id);

$('authInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') submitAuth();
});

function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined) node.textContent = text;
  return node;
}
const pct = (x, d = 1) => (x == null || !Number.isFinite(x) ? '—' : `${(x * 100).toFixed(d)}%`);
const num2 = x => (x == null || !Number.isFinite(x) ? '—' : x.toFixed(2));
const intFmt = new Intl.NumberFormat('en-US', { maximumFractionDigits: 0 });
const compactFmt = new Intl.NumberFormat('zh-TW', { notation: 'compact', maximumFractionDigits: 1 });
const money = (x, cur = state.plan.currency) => (x == null || !Number.isFinite(x) ? '—' : `${cur} ${intFmt.format(Math.round(x))}`);
const compact = x => (Number.isFinite(x) ? compactFmt.format(x) : '—');
function debounce(fn, ms) {
  let t;
  return (...args) => { clearTimeout(t); t = setTimeout(() => fn(...args), ms); };
}
function loadJSON(key, fallback) {
  try { return JSON.parse(localStorage.getItem(key)) ?? fallback; } catch (e) { return fallback; }
}
function saveJSON(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)); } catch (e) { console.error('儲存失敗', key, e); }
}

// ============================================================
// 狀態
// ============================================================
const state = {
  plan: null,
  portfolio: loadJSON(STORE.portfolio, DEFAULT_PORTFOLIO),
  current: null,     // { label, portfolio, plan, result, sim, cpiFallbackMonths }
  previous: null,
  meta: null,
  series: new Map(),
  backtestCache: new Map(),
  charts: {},
  tab: localStorage.getItem(STORE.tab) || 'scenarios',
  logScale: localStorage.getItem(STORE.logScale) !== '0',
  isSending: false
};

if (localStorage.getItem(STORE.theme) === 'dark') document.body.classList.add('dark');

function toggleTheme() {
  document.body.classList.toggle('dark');
  localStorage.setItem(STORE.theme, document.body.classList.contains('dark') ? 'dark' : 'light');
  renderDashboard();
}

function toggleAdvisor(force) {
  const open = force ?? !document.body.classList.contains('advisor-open');
  document.body.classList.toggle('advisor-open', open);
}

// ============================================================
// 資料與模組
// ============================================================
function modulesReady() {
  if (window.RP_MODULES) return Promise.resolve(window.RP_MODULES);
  return new Promise(resolve => window.addEventListener('rp-modules-ready', () => resolve(window.RP_MODULES), { once: true }));
}

function loadMeta() {
  if (!state.meta) {
    state.meta = Promise.all([
      modulesReady(),
      fetch('backtest/index-mapping.json').then(r => r.json()),
      fetch('data/manifest.json').then(r => r.json())
    ]).then(([mods, mapping, manifest]) => ({ ...mods, mapping, manifest }));
    state.meta.catch(() => { state.meta = null; });
  }
  return state.meta;
}

function earliestDate(meta, symbol) {
  const dates = meta.engine.resolveChain(symbol, meta.mapping)
    .map(link => meta.manifest.symbols[link.symbol]?.firstDate)
    .filter(Boolean)
    .sort();
  return dates[0] || null;
}

function backtestableSymbols(meta) {
  const proxies = new Set(Object.values(meta.mapping.etfs).flatMap(e => e.proxies.map(p => p.symbol.toUpperCase())));
  const list = new Set(Object.keys(meta.mapping.etfs));
  for (const [s, info] of Object.entries(meta.manifest.symbols)) {
    if (!proxies.has(s) && info.instrumentType !== 'CPI') list.add(s);
  }
  return [...list].filter(s => earliestDate(meta, s)).sort();
}

function loadSeries(meta, symbol) {
  if (!state.series.has(symbol)) {
    const p = fetch('data/' + meta.engine.symbolToFile(symbol)).then(r => {
      if (!r.ok) throw new Error(`無法載入 ${symbol}（HTTP ${r.status}）`);
      return r.json();
    });
    p.catch(() => state.series.delete(symbol));
    state.series.set(symbol, p);
  }
  return state.series.get(symbol);
}

async function runBacktestCached(pf) {
  const key = JSON.stringify([pf.holdings, pf.rebalance, pf.start, pf.end]);
  if (state.backtestCache.has(key)) return state.backtestCache.get(key);
  const meta = await loadMeta();
  const symbols = Object.keys(pf.holdings);
  const missing = symbols.filter(s => !earliestDate(meta, s));
  if (missing.length) {
    throw new Error(`沒有 ${missing.join('、')} 的價格資料。請在本機執行 npm run fetch -- ${missing.join(' ')} 後重新整理。`);
  }
  const needed = meta.engine.symbolsNeeded(symbols, meta.mapping).filter(s => meta.manifest.symbols[s]);
  const loaded = await Promise.all(needed.map(s => loadSeries(meta, s)));
  const result = meta.engine.runBacktest({
    holdings: pf.holdings, rebalance: pf.rebalance, start: pf.start || undefined, end: pf.end || undefined
  }, meta.mapping, Object.fromEntries(needed.map((s, i) => [s, loaded[i]])));
  state.backtestCache.set(key, result);
  return result;
}

async function loadCpi(meta) {
  if (!meta.manifest.symbols.CPI_US) return null;
  return (await loadSeries(meta, 'CPI_US')).series;
}

// ============================================================
// 計劃表單
// ============================================================
function renderPlanForm() {
  const form = $('planForm');
  form.innerHTML = '';
  for (const f of PLAN_FIELDS) {
    const field = el('div', 'field' + (f.wide ? ' wide' : ''));
    const label = el('label', '', f.label);
    label.htmlFor = 'plan-' + f.key;
    field.appendChild(label);

    if (f.type === 'inflation') {
      const seg = el('div', 'seg');
      seg.id = 'plan-inflationMode';
      [['cpi', '美國歷史 CPI'], ['fixed', '固定通膨假設']].forEach(([value, text]) => {
        const b = el('button', '', text);
        b.type = 'button';
        b.dataset.value = value;
        b.onclick = () => { state.plan.inflationMode = value; writePlanForm(); onPlanEdited(); };
        seg.appendChild(b);
      });
      field.appendChild(seg);
    } else {
      const wrap = el('div', 'input-wrap');
      let input;
      if (f.type === 'currency') {
        input = el('select');
        CURRENCIES.forEach(c => { const o = el('option', '', c); o.value = c; input.appendChild(o); });
      } else {
        input = el('input');
        input.type = 'number';
        input.step = f.step;
        input.min = 0;
        input.inputMode = 'decimal';
      }
      input.id = 'plan-' + f.key;
      input.addEventListener('input', onPlanEdited);
      input.addEventListener('change', onPlanEdited);
      wrap.appendChild(input);
      if (f.unit !== undefined || f.money) {
        const unit = el('span', 'unit', f.money ? '' : f.unit);
        unit.dataset.money = f.money ? f.unit : '';
        wrap.appendChild(unit);
      }
      field.appendChild(wrap);
    }
    form.appendChild(field);
  }
}

function writePlanForm() {
  const p = state.plan;
  for (const f of PLAN_FIELDS) {
    if (f.type === 'inflation') {
      $('plan-inflationMode').querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.value === p.inflationMode));
      continue;
    }
    const input = $('plan-' + f.key);
    if (document.activeElement !== input) input.value = p[f.key];
  }
  document.querySelectorAll('#planForm .unit').forEach(u => {
    if (u.dataset.money !== '') u.textContent = `${p.currency}${u.dataset.money}`;
  });
  renderPlanTimeline();
}

function readPlanForm() {
  const p = { ...state.plan };
  for (const f of PLAN_FIELDS) {
    if (f.type === 'inflation') continue;
    const v = $('plan-' + f.key).value;
    p[f.key] = f.type === 'currency' ? v : (v === '' ? 0 : Number(v));
  }
  return p;
}

function renderPlanTimeline() {
  const p = state.plan;
  const total = Math.max(1, p.endAge - p.currentAge);
  const acc = Math.max(0, p.retireAge - p.currentAge);
  $('planTimeline').children[0].style.width = `${acc / total * 100}%`;
  $('planTimeline').children[1].style.width = `${(total - acc) / total * 100}%`;
  $('planTimelineLabels').innerHTML = '';
  [`${p.currentAge} 歲`, `累積 ${acc} 年 → ${p.retireAge} 歲退休`, `提領 ${p.endAge - p.retireAge} 年 → ${p.endAge} 歲`]
    .forEach(t => $('planTimelineLabels').appendChild(el('span', '', t)));
  $('planChip').textContent = `${p.currentAge} 歲 · ${p.retireAge} 歲退休 · 規劃至 ${p.endAge} 歲 · 年支出 ${money(p.annualSpending)}`;
}

const recalcPlanOnly = debounce(() => recalc({ markPrevious: false }), 350);

function onPlanEdited() {
  state.plan = window.RP_MODULES ? window.RP_MODULES.retirement.normalizePlan(readPlanForm()) : readPlanForm();
  saveJSON(STORE.plan, state.plan);
  renderPlanTimeline();
  document.querySelectorAll('#planForm .unit').forEach(u => {
    if (u.dataset.money !== '') u.textContent = `${state.plan.currency}${u.dataset.money}`;
  });
  recalcPlanOnly();
}

// ============================================================
// 組合編輯
// ============================================================
function addHoldingRow(symbol, weight) {
  const row = el('div', 'holding');
  const sym = el('input', 'sym');
  sym.setAttribute('list', 'symbolList');
  sym.placeholder = '代號，如 VTI';
  sym.value = symbol;
  const w = el('input', 'w');
  w.type = 'number'; w.min = 0; w.step = 1; w.placeholder = '%';
  w.value = weight;
  const x = el('button', 'x-btn', '✕');
  x.title = '移除';
  x.onclick = () => { row.remove(); onPortfolioEdited(); };
  const bar = el('div', 'bar');
  bar.appendChild(el('span'));
  row.append(sym, w, x, bar);
  [sym, w].forEach(i => i.addEventListener('input', onPortfolioEdited));
  $('holdings').appendChild(row);
  updateWeightBars();
}

function writePortfolioForm(pf) {
  $('holdings').innerHTML = '';
  Object.entries(pf.holdings).forEach(([s, w]) => addHoldingRow(s, w));
  $('rebalance').value = pf.rebalance || 'annual';
  $('btStart').value = pf.start || '';
  $('btEnd').value = pf.end || '';
  $('portfolioName').textContent = pf.name || '';
  updateWeightBars();
}

function readPortfolioForm() {
  const holdings = {};
  document.querySelectorAll('#holdings .holding').forEach(row => {
    const s = row.querySelector('.sym').value.trim().toUpperCase();
    const w = Number(row.querySelector('.w').value);
    if (s && w > 0) holdings[s] = (holdings[s] || 0) + w;
  });
  return {
    name: $('portfolioName').textContent || '自訂組合',
    holdings,
    rebalance: $('rebalance').value,
    start: $('btStart').value,
    end: $('btEnd').value
  };
}

function updateWeightBars() {
  const rows = [...document.querySelectorAll('#holdings .holding')];
  const total = rows.reduce((a, r) => a + (Number(r.querySelector('.w').value) || 0), 0);
  rows.forEach(r => {
    const w = Number(r.querySelector('.w').value) || 0;
    r.querySelector('.bar span').style.width = total > 0 ? `${w / total * 100}%` : '0';
  });
  const off = Math.abs(total - 100) > 0.01;
  $('weightSum').textContent = `合計 ${Number(total.toFixed(2))}%${off ? '（自動按比例）' : ''}`;
  $('weightSum').style.color = off ? 'var(--warn)' : '';
}

function onPortfolioEdited() {
  $('portfolioName').textContent = '自訂組合';
  updateWeightBars();
  state.portfolio = readPortfolioForm();
  saveJSON(STORE.portfolio, state.portfolio);
}

// ============================================================
// 計算
// ============================================================
function setStatus(text, isError) {
  $('status').textContent = text;
  $('status').classList.toggle('error', Boolean(isError));
}

let recalcSeq = 0;
async function recalc({ markPrevious = true, label } = {}) {
  const seq = ++recalcSeq;
  const pf = readPortfolioForm();
  if (!Object.keys(pf.holdings).length) { setStatus('請至少輸入一檔 ETF 與權重。', true); return null; }
  state.portfolio = pf;
  saveJSON(STORE.portfolio, pf);
  $('calcBtn').disabled = true;
  setStatus('計算中…');
  try {
    const meta = await loadMeta();
    const plan = meta.retirement.normalizePlan(readPlanForm());
    state.plan = plan;
    saveJSON(STORE.plan, plan);
    const result = await runBacktestCached(pf);
    const cpi = plan.inflationMode === 'cpi' ? await loadCpi(meta) : null;
    const { returns, cpiFallbackMonths } = meta.retirement.realMonthlyReturns(result.equityMonthly, plan, cpi);
    const sim = meta.retirement.simulateRetirement(plan, returns);
    if (seq !== recalcSeq) return null;
    if (markPrevious && state.current) state.previous = state.current;
    state.current = { label: label || pf.name, portfolio: pf, plan, result, sim, cpiFallbackMonths };
    renderDashboard();
    setStatus(`已更新 · 歷史 ${sim.history.start} ~ ${sim.history.end} · ${intFmt.format(sim.history.starts)} 個起始月份`);
    return state.current;
  } catch (e) {
    console.error(e);
    if (seq === recalcSeq) setStatus('計算失敗：' + e.message, true);
    return null;
  } finally {
    if (seq === recalcSeq) $('calcBtn').disabled = false;
  }
}

// ============================================================
// 儀表板
// ============================================================
function themeColors() {
  const css = getComputedStyle(document.body);
  const v = name => css.getPropertyValue(name).trim();
  return { text: v('--text'), muted: v('--muted'), border: v('--border'), accent: v('--accent'), accent2: v('--accent-2'), good: v('--good'), bad: v('--bad'), warn: v('--warn'), faint: v('--faint') };
}

function hexToRgba(hex, a) {
  const h = hex.replace('#', '');
  const n = parseInt(h.length === 3 ? h.split('').map(c => c + c).join('') : h, 16);
  return `rgba(${(n >> 16) & 255}, ${(n >> 8) & 255}, ${n & 255}, ${a})`;
}

function makeChart(id, config) {
  if (state.charts[id]) state.charts[id].destroy();
  const canvas = $(id);
  if (!canvas || !window.Chart) return;
  const c = themeColors();
  Chart.defaults.color = c.muted;
  Chart.defaults.borderColor = c.border;
  Chart.defaults.font.family = getComputedStyle(document.body).fontFamily;
  state.charts[id] = new Chart(canvas, config);
}

function successTone(rate) {
  return rate >= 0.9 ? 'good' : rate >= 0.75 ? 'warn' : 'bad';
}

function setDelta(id, cur, prev, fmt, higherIsBetter = true) {
  const node = $(id);
  if (prev == null || !Number.isFinite(prev) || !Number.isFinite(cur)) { node.textContent = ''; node.className = 'delta'; return; }
  const diff = cur - prev;
  if (Math.abs(diff) < 1e-9) { node.textContent = '與上一版相同'; node.className = 'delta'; return; }
  const better = higherIsBetter ? diff > 0 : diff < 0;
  node.textContent = `${diff > 0 ? '▲' : '▼'} ${fmt(Math.abs(diff))} vs 上一版`;
  node.className = 'delta ' + (better ? 'up' : 'down');
}

function renderDashboard() {
  const cur = state.current;
  if (!cur) return;
  const { sim, plan } = cur;
  const prev = state.previous?.sim;
  const c = themeColors();

  const tone = successTone(sim.successRate);
  const meter = $('ringMeter');
  meter.style.stroke = c[tone];
  meter.setAttribute('stroke-dashoffset', String(314.16 * (1 - sim.successRate)));
  $('ringText').textContent = pct(sim.successRate, sim.successRate > 0.995 && sim.successRate < 1 ? 1 : 0);
  $('kpiSuccessSub').innerHTML = '';
  const pill = el('span', 'pill ' + tone, tone === 'good' ? '穩健' : tone === 'warn' ? '需留意' : '風險高');
  $('kpiSuccessSub').append(pill, document.createTextNode(` 資產撐到 ${plan.endAge} 歲的歷史比例（${intFmt.format(sim.history.starts)} 個起點）`));
  setDelta('kpiSuccessDelta', sim.successRate, prev?.successRate, x => pct(x));

  const atRetire = sim.balanceAtRetire;
  $('kpiRetire').textContent = atRetire ? compact(atRetire.p50) : '—';
  $('kpiRetireSub').textContent = atRetire
    ? `P10 ${compact(atRetire.p10)} · P90 ${compact(atRetire.p90)} · 初始提領率 ${pct(sim.initialWithdrawalRate)}`
    : '已在退休期';
  setDelta('kpiRetireDelta', atRetire?.p50, prev?.balanceAtRetire?.p50, compact);

  const s95 = sim.sustainableSpending.p95;
  $('kpiSpend').textContent = compact(s95);
  const gap = s95 - plan.annualSpending;
  $('kpiSpendSub').innerHTML = '';
  $('kpiSpendSub').append(
    document.createTextNode(`目標 ${compact(plan.annualSpending)} · `),
    el('span', gap >= 0 ? 'delta up' : 'delta down', gap >= 0 ? `寬裕 ${compact(gap)}` : `不足 ${compact(-gap)}`)
  );
  setDelta('kpiSpendDelta', s95, prev?.sustainableSpending?.p95, compact);

  const worst = sim.worstRuns[0];
  $('kpiWorst').textContent = worst ? worst.start : '—';
  $('kpiWorstSub').textContent = worst
    ? (worst.success ? `即使最差也撐到 ${plan.endAge} 歲，期末 ${compact(worst.endBalance)}` : `${worst.depletedAge.toFixed(1)} 歲資產耗盡`)
    : '';
  $('kpiWorst').style.color = worst && !worst.success ? 'var(--bad)' : '';

  renderFanChart(cur, c);
  renderActiveTab();
}

const retireLinePlugin = {
  id: 'retireLine',
  afterDatasetsDraw(chart, args, opts) {
    if (opts.age == null) return;
    const x = chart.scales.x.getPixelForValue(opts.age);
    const { top, bottom } = chart.chartArea;
    const ctx = chart.ctx;
    ctx.save();
    ctx.strokeStyle = opts.color;
    ctx.setLineDash([4, 4]);
    ctx.beginPath(); ctx.moveTo(x, top); ctx.lineTo(x, bottom); ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = opts.color;
    ctx.font = '600 11px sans-serif';
    ctx.fillText(`${opts.age} 歲退休`, x + 6, top + 12);
    ctx.restore();
  }
};

  const pts = key => sim.bands.map(b => ({ x: b.age, y: b[key] }));

    { label: 'P90', data: pts('p90'), borderColor: 'transparent', pointRadius: 0, fill: false },

    { label: 'P75', data: pts('p75'), borderColor: 'transparent', pointRadius: 0, fill: false },
    { label: 'P25–P75', data: pts('p25'), borderColor: 'transparent', pointRadius: 0, fill: '-1', backgroundColor: hexToRgba(c.accent, 0.20) },
    { label: '中位數', data: pts('p50'), borderColor: c.accent, borderWidth: 2.5, pointRadius: 0, fill: false },
    { label: '最差（最低值）', data: pts('min'), borderColor: c.bad, borderWidth: 1.2, borderDash: [5, 4], pointRadius: 0, fill: false }
  ];
  makeChart('fanChart', {
    type: 'line',
    data: { datasets },
    plugins: [retireLinePlugin],
    options: {
      animation: false, maintainAspectRatio: false, parsing: false,
      interaction: { mode: 'index', intersect: false },
      scales: {
        x: { type: 'linear', min: plan.currentAge, max: plan.endAge, ticks: { stepSize: 5, callback: v => `${v} 歲` }, grid: { display: false } },
        y: { beginAtZero: true, ticks: { callback: v => compact(v) } }
      },
      plugins: {
        retireLine: { age: plan.retireAge > plan.currentAge ? plan.retireAge : null, color: c.warn },
        legend: { labels: { boxWidth: 12, filter: item => !['P90', 'P75'].includes(item.text) } },
        tooltip: {
          filter: item => !['P90–', 'P75'].includes(item.dataset.label),
          callbacks: {
            title: items => `${items[0].parsed.x} 歲`,
            label: item => {
              const b = sim.bands.find(x => x.age === item.parsed.x);
              const map = { 'P10–P90': ['P10', b.p10], 'P25–P75': ['P25', b.p25], '中位數': ['中位數', b.p50], '最差（最低值）': ['最差', b.min], 'P90': ['P90', b.p90], 'P75': ['P75', b.p75] };
              const [name, value] = map[item.dataset.label] || [item.dataset.label, item.parsed.y];
              return `${name}：${money(value)}`;
            }
          }
        }
      }
    }
  });
  $('fanHint').textContent = `${plan.currency}，今日幣值`;
  const h = sim.history;
  const method = h.method === 'rolling' ? '完整歷史窗口' : '歷史不足計劃年限，以循環序列補足';
  const infl = plan.inflationMode === 'cpi'
    ? `美國 CPI${cur.cpiFallbackMonths ? `（最近 ${cur.cpiFallbackMonths} 個月缺 CPI，以 ${plan.inflationRate}% 替代）` : ''}`
    : `固定 ${plan.inflationRate}%/年`;
  $('fanNote').textContent = `以 ${h.start} ~ ${h.end} 每個起始月份各模擬一次（${intFmt.format(h.starts)} 次，${method}）。通膨：${infl}；費用 ${plan.feeRate}%/年。色帶為各年齡資產的 P10–P90 與 P25–P75。`;
}

function statBox(k, v, p, neg) {
  const box = el('div', 'stat');
  box.append(el('div', 'k', k), el('div', 'v' + (neg ? ' neg' : ''), v));
  if (p) box.appendChild(el('div', 'p', p));
  return box;
}

function table(headers, rows, className = 'tbl') {
  const wrap = el('div', 'tbl-wrap');
  const t = el('table', className);
  const head = t.insertRow();
  headers.forEach(h => head.appendChild(el('th', '', h)));
  rows.forEach(cells => {
    const tr = t.insertRow();
    cells.forEach(c => {
      const td = tr.insertCell();
      if (c && typeof c === 'object') {
        td.textContent = c.text;
        if (c.neg) td.classList.add('neg');
        if (c.bg) td.style.background = c.bg;
        if (c.title) td.title = c.title;
      } else td.textContent = c;
    });
  });
  wrap.appendChild(t);
  return wrap;
}

function describePlan(p) {
  const income = p.otherIncome > 0 ? `其他收入每年 ${money(p.otherIncome, p.currency)}（${p.otherIncomeAge} 歲起）` : '無其他退休收入';
  const infl = p.inflationMode === 'cpi' ? `美國歷史 CPI（缺月以 ${p.inflationRate}% 替代）` : `固定 ${p.inflationRate}%/年`;
  return [
    `幣別 ${p.currency}；目前 ${p.currentAge} 歲、${p.retireAge} 歲退休、規劃至 ${p.endAge} 歲（所有金額為今日幣值）`,
    `現有投資資產 ${money(p.currentSavings, p.currency)}；每月投入 ${money(p.monthlyContribution, p.currency)}（至退休）；退休後每年支出 ${money(p.annualSpending, p.currency)}；${income}`,
    `通膨：${infl}；費用＋成本 ${p.feeRate}%/年`
  ].join('\n');
}

function describeSim(cur) {
  const { sim, plan } = cur;
  const h = sim.history;
  const w = sim.withdrawalRates;
  const keyAges = [...new Set([plan.retireAge, plan.retireAge + 10, plan.retireAge + 20, plan.endAge])].filter(a => a >= plan.currentAge && a <= plan.endAge);
  const lines = [
    `方法：${h.start} ~ ${h.end} 共 ${h.months} 個月實質報酬（已扣費用與通膨），${h.starts} 個起始月份（${h.method === 'rolling' ? '完整歷史窗口' : '歷史不足，循環序列'}）${cur.cpiFallbackMonths ? `；${cur.cpiFallbackMonths} 個月缺 CPI` : ''}`,
    `成功率 ${pct(sim.successRate, 1)}`,
    sim.balanceAtRetire ? `退休時資產：中位 ${money(sim.balanceAtRetire.p50)}、P10 ${money(sim.balanceAtRetire.p10)}、P90 ${money(sim.balanceAtRetire.p90)}；以中位數計初始淨提領率 ${pct(sim.initialWithdrawalRate, 2)}` : '已在退休期',
    `期末資產（${plan.endAge} 歲）：中位 ${money(sim.endBalance.p50)}、P10 ${money(sim.endBalance.p10)}、最差 ${money(sim.endBalance.min)}`,
    `可持續年支出：100% 歷史成功 ${money(sim.sustainableSpending.p100)}、95% ${money(sim.sustainableSpending.p95)}、90% ${money(sim.sustainableSpending.p90)}、中位 ${money(sim.sustainableSpending.p50)}（目前目標 ${money(plan.annualSpending)}）`,
    `提領期 ${w.horizonYears} 年的 SWR：最差 ${pct(w.swr.min, 2)}（${w.worstStart} 起）、P5 ${pct(w.swr.p5, 2)}、P10 ${pct(w.swr.p10, 2)}、中位 ${pct(w.swr.p50, 2)}；PWR：最差 ${pct(w.pwr.min, 2)}、P10 ${pct(w.pwr.p10, 2)}、中位 ${pct(w.pwr.p50, 2)}`,
    '最差起始時點：' + sim.worstRuns.map(r => `${r.start}${r.success ? '（成功）' : `（${r.depletedAge.toFixed(1)} 歲耗盡）`}`).join('、'),
    '各年齡資產分位：' + keyAges.map(a => {
      const b = sim.bands.find(x => x.age === a);
      return b ? `${a} 歲 P10 ${compact(b.p10)} / 中位 ${compact(b.p50)} / P90 ${compact(b.p90)}` : '';
    }).filter(Boolean).join('；')
  ];
  const failedYears = sim.byStartYear.filter(d => !d.success).map(d => d.year);
  if (failedYears.length) lines.push(`失敗的起始年份（1 月起點）：${failedYears.slice(0, 40).join('、')}${failedYears.length > 40 ? ' 等' : ''}`);
  return lines.join('\n');
}

function describeBacktest(name, r, brief) {
  const s = r.stats;
  const lines = [
    `組合：${name}；權重：${r.portfolio.holdings.map(h => `${h.symbol} ${(h.weight * 100).toFixed(1)}%`).join('、')}；再平衡：${r.portfolio.rebalance}`,
    `期間：${r.period.start} ~ ${r.period.end}（${r.period.years.toFixed(1)} 年），起點受 ${r.period.limitingAsset} 限制`,
    `名目 CAGR ${pct(s.cagr, 2)}、年化波動 ${pct(s.volatility, 2)}、Sharpe(rf=0) ${num2(s.sharpe)}、Sortino ${num2(s.sortino)}、Calmar ${num2(s.calmar)}`,
    `最大回撤 ${pct(s.maxDrawdown, 2)}（${s.peakDate} → ${s.troughDate}，回復：${s.recoveryDate || '尚未回復'}）`
  ];
  if (brief) return lines.join('\n');
  const yearly = r.annualReturns;
  const shown = yearly.length > 60 ? yearly.filter(y => y.return < -0.1 || y.return > 0.25 || y.year >= yearly.at(-1).year - 30) : yearly;
  lines.push(`逐年報酬${shown.length < yearly.length ? '（只列近 30 年及 -10% 以下或 +25% 以上的年份）' : ''}：` + shown.map(y => `${y.year}${y.partial ? '*' : ''} ${pct(y.return)}`).join('、'));
  lines.push('各資產（同期間）：');
  for (const a of r.assets) {
    lines.push(`- ${a.symbol}：權重 ${(a.weight * 100).toFixed(1)}%，CAGR ${pct(a.cagr, 2)}，波動 ${pct(a.volatility, 2)}，最大回撤 ${pct(a.maxDrawdown, 2)}；數據：${a.dataSources.map(d => `${d.symbol}[${d.type}] ${d.from.slice(0, 4)}~`).join(' ← ')}`);
  }
  const c = r.correlation;
  if (c.symbols.length > 1) {
    lines.push('月報酬相關係數：' + c.symbols.map((sym, i) => `${sym}[${c.symbols.map((o, j) => j > i ? `${o} ${c.matrix[i][j].toFixed(2)}` : '').filter(Boolean).join(' ')}]`).filter(x => !x.endsWith('[]')).join('；'));
  }
  if (r.warnings.length) lines.push('注意：' + r.warnings.join('；'));
  return lines.join('\n');
}

async function buildBacktestContext() {
  const parts = [];
  try {
    const meta = await loadMeta();
    parts.push('【可回測代號】（括號內為含替代序列後最早年份）：' + backtestableSymbols(meta).map(s => `${s}(${earliestDate(meta, s).slice(0, 4)})`).join('、'));
  } catch (e) {
    parts.push('【可回測代號】載入失敗');
  }
  parts.push('【退休計劃】\n' + describePlan(state.plan));
  const cur = state.current;
  if (cur) {
    parts.push('【退休模擬結果】\n' + describeSim(cur));
    parts.push('【組合回測】\n' + describeBacktest(cur.portfolio.name, cur.result, false));
  } else {
    parts.push('（尚未完成計算）');
  }
  const prev = state.previous;
  if (prev) {
    parts.push(`【上一版，供比較】\n退休年齡 ${prev.plan.retireAge}、年支出 ${money(prev.plan.annualSpending)}、每月投入 ${money(prev.plan.monthlyContribution)}；成功率 ${pct(prev.sim.successRate, 1)}；95% 可持續年支出 ${money(prev.sim.sustainableSpending.p95)}\n` + describeBacktest(prev.portfolio.name, prev.result, true));
  }
  let text = parts.join('\n\n');
  if (text.length > 11800) text = text.slice(0, 11800) + '\n…（已截斷）';
  return text;
}

function parsePortfolioBlock(text) {
  let obj;
  try { obj = JSON.parse(text); } catch (e) { return null; }
  if (!obj || typeof obj.holdings !== 'object' || obj.holdings === null) return null;
  const holdings = {};
  for (const [symbol, weight] of Object.entries(obj.holdings)) {
    const w = Number(weight);
    const s = String(symbol).trim().toUpperCase();
    if (s && Number.isFinite(w) && w > 0) holdings[s] = w;
  }
  if (!Object.keys(holdings).length) return null;
  const isDate = v => typeof v === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(v);
  return {
    name: String(obj.name || 'AI 建議組合').slice(0, 40),
    holdings,
    rebalance: REBALANCE_LABELS[obj.rebalance] ? obj.rebalance : 'annual',
    start: isDate(obj.start) ? obj.start : '',
    end: isDate(obj.end) ? obj.end : ''
  };
}

const PLAN_NUMERIC_KEYS = ['currentAge', 'retireAge', 'endAge', 'currentSavings', 'monthlyContribution', 'annualSpending', 'otherIncome', 'otherIncomeAge', 'inflationRate', 'feeRate'];

function parsePlanBlock(text) {
  let obj;
  try { obj = JSON.parse(text); } catch (e) { return null; }
  if (!obj || typeof obj !== 'object') return null;
  const changes = {};
  for (const k of PLAN_NUMERIC_KEYS) if (obj[k] !== undefined && Number.isFinite(Number(obj[k]))) changes[k] = Number(obj[k]);
  if (obj.inflationMode === 'cpi' || obj.inflationMode === 'fixed') changes.inflationMode = obj.inflationMode;
  if (typeof obj.currency === 'string' && /^[A-Z]{3}$/.test(obj.currency)) changes.currency = obj.currency;
  if (!Object.keys(changes).length) return null;
  return { note: typeof obj.note === 'string' ? obj.note.slice(0, 80) : '', changes };
}

function formatPlanValue(key, v) {
  if (['currentSavings', 'monthlyContribution', 'annualSpending', 'otherIncome'].includes(key)) return intFmt.format(v);
  if (['inflationRate', 'feeRate'].includes(key)) return `${v}%`;
  if (key === 'inflationMode') return v === 'cpi' ? '美國 CPI' : '固定假設';
  if (key.endsWith('Age')) return `${v} 歲`;
  return String(v);
}

function buildPortfolioCard(pf) {
  const card = el('div', 'action-card');
  card.appendChild(el('div', 'ac-title', '📦 ' + pf.name));
  const chips = el('div', 'chips');
  Object.entries(pf.holdings).forEach(([s, w]) => chips.appendChild(el('span', 'chip', `${s} ${w}%`)));
  card.appendChild(chips);
  const range = (pf.start || pf.end) ? `；期間 ${pf.start || '最早'} ~ ${pf.end || '最新'}` : '';
  card.appendChild(el('div', 'ac-meta', `${REBALANCE_LABELS[pf.rebalance]}${range}`));
  const actions = el('div', 'ac-actions');
  const apply = el('button', 'btn primary', '套用並回測');
  apply.onclick = () => applyPortfolioFromAi(pf);
  const fill = el('button', 'btn', '只填入組合');
  fill.onclick = () => { writePortfolioForm(pf); state.portfolio = readPortfolioForm(); saveJSON(STORE.portfolio, state.portfolio); toggleAdvisor(false); };
  actions.append(apply, fill);
  card.appendChild(actions);
  return card;
}

function buildPlanCard(plan) {
  const card = el('div', 'action-card plan');
  card.appendChild(el('div', 'ac-title', '🎯 計劃調整' + (plan.note ? `：${plan.note}` : '')));
  const chips = el('div', 'chips');
  for (const [k, v] of Object.entries(plan.changes)) {
    const before = state.plan[k];
    chips.appendChild(el('span', 'chip', `${PLAN_LABELS[k] || k}：${formatPlanValue(k, before)} → ${formatPlanValue(k, v)}`));
  }
  card.appendChild(chips);
  const actions = el('div', 'ac-actions');
  const apply = el('button', 'btn primary', '套用計劃並重算');
  apply.onclick = () => applyPlanFromAi(plan);
  actions.appendChild(apply);
  card.appendChild(actions);
  return card;
}

function summaryLine(cur, prev) {
  const s = cur.sim;
  const vs = prev ? `（上一版 ${pct(prev.sim.successRate, 1)}）` : '';
  return `成功率 ${pct(s.successRate, 1)}${vs}，95% 可持續年支出 ${money(s.sustainableSpending.p95)}，最差起點 ${s.worstRuns[0]?.start}${s.worstRuns[0] && !s.worstRuns[0].success ? `（${s.worstRuns[0].depletedAge.toFixed(1)} 歲耗盡）` : ''}，組合 CAGR ${pct(cur.result.stats.cagr, 2)}、最大回撤 ${pct(cur.result.stats.maxDrawdown, 1)}`;
}

async function autoSendAfterApply(what) {
  const cur = state.current;
  if (!cur) return;
  if (state.isSending) { setStatus('已重算。AI 仍在回覆中，稍後可再請它分析。'); return; }
  sendMessage(`已套用${what}並重算：${summaryLine(cur, state.previous)}。請分析結果並繼續改良。`);
}

async function applyPortfolioFromAi(pf) {
  writePortfolioForm(pf);
  const cur = await recalc({ markPrevious: true, label: pf.name });
  if (cur) autoSendAfterApply(`組合「${pf.name}」`);
}

async function applyPlanFromAi(plan) {
  state.plan = { ...state.plan, ...plan.changes };
  writePlanForm();
  const cur = await recalc({ markPrevious: true });
  if (cur) autoSendAfterApply(`計劃調整${plan.note ? `「${plan.note}」` : ''}`);
}

function toggleConvMenu(e) {
  e.stopPropagation();

  const menu = el('div', 'menu');

  rename.onclick = () => {

    const t = conv && prompt('新的對話名稱：', conv.title);
    if (t && t.trim()) { conv.title = t.trim(); saveConversations(); renderConvSelect(); }

  };

function formatTime(ts) {

function renderMarkdown(container, text) {
  container.innerHTML = DOMPurify.sanitize(marked.parse(text));
  container.querySelectorAll('pre code.language-portfolio').forEach(code => {

    if (pf) code.parentElement.replaceWith(buildPortfolioCard(pf));

  container.querySelectorAll('pre code.language-plan').forEach(code => {
    const plan = parsePlanBlock(code.textContent);
    if (plan) code.parentElement.replaceWith(buildPlanCard(plan));
  });
  container.querySelectorAll('pre code').forEach(code => {
    const lang = (code.className.match(/language-(\w+)/) || [])[1] || 'code';
    if (!['portfolio', 'plan'].includes(lang) && hljs.getLanguage(lang)) hljs.highlightElement(code);
    const pre = code.parentElement;
    const box = el('div', 'code-box');
    const head = el('div', 'code-head');

    copy.onclick = () => navigator.clipboard.writeText(code.innerText).then(() => { copy.textContent = '✓ 已複製'; setTimeout(() => { copy.textContent = '複製'; }, 1200); });
    head.appendChild(copy);
    pre.replaceWith(box);
    box.append(head, pre);
  });
}

function welcomeEl() {

    .forEach(q => { const b = el('button', '', q); b.onclick = () => sendMessage(q); quick.appendChild(b); });

function buildMessageEl(m, conv) {
  const wrap = el('div', 'msg ' + m.role);
  const bubble = el('div', 'bubble');
  if (m.role === 'bot') renderMarkdown(bubble, m.text || '');
  else bubble.textContent = m.text;
  wrap.appendChild(bubble);
  if (m.attachmentName) wrap.appendChild(el('div', 'attach-tag', '📎 ' + m.attachmentName));

  const meta = el('div', 'msg-meta');
  meta.appendChild(el('span', '', formatTime(m.time)));
  if (m.usedModel) meta.appendChild(el('span', '', `· ${MODEL_NAMES[m.usedModel] || m.usedModel}${Number.isFinite(m.complexity) ? `（評分 ${m.complexity}）` : ''}`));
  if (m.role !== 'error') {
    const copy = el('button', '', '複製');
    copy.onclick = () => navigator.clipboard.writeText(m.text).then(() => { copy.textContent = '✓'; setTimeout(() => { copy.textContent = '複製'; }, 1200); });
    meta.appendChild(copy);
  } else {
    const retry = el('button', '', '↻ 重新送出');
    retry.onclick = () => { conv.messages = conv.messages.filter(x => x !== m); resendLastQuery(conv); };
    meta.appendChild(retry);
  }
  wrap.appendChild(meta);

  if (m.summarizerRaw) {
    const d = el('details', 'debug');
    d.appendChild(el('summary', '', '摘要／評分過程'));
    let shown = m.summarizerRaw;
    try { shown = JSON.stringify(JSON.parse(m.summarizerRaw), null, 2); } catch (e) {}
    d.appendChild(el('pre', '', shown));
    wrap.appendChild(d);
  }
  return wrap;
}

function renderMessages() {

  $('convSelect').value = conv.id;
  if ($('modelSelect').querySelector(`option[value="${conv.model}"]`)) $('modelSelect').value = conv.model;
  if (!conv.messages.length) box.appendChild(welcomeEl());
  conv.messages.forEach(m => box.appendChild(buildMessageEl(m, conv)));

// ----- 附件（圖片／PDF 直接送模型；文字檔併入訊息）-----
const MAX_ATTACHMENT_BYTES = 15 * 1024 * 1024;
const MAX_EXTRACTED_CHARS = 40000;

async function handleFileSelect(event) {
  const file = event.target.files[0];
  event.target.value = '';
  if (!file) return;
  if (file.size > MAX_ATTACHMENT_BYTES) { alert('檔案過大，請上傳 15MB 以內的檔案。'); return; }
  const ext = file.name.slice(file.name.lastIndexOf('.')).toLowerCase();
  if (['.txt', '.csv', '.md'].includes(ext)) {
    const text = await file.text();
    pendingAttachment = { kind: 'text', filename: file.name, extractedText: text.length > MAX_EXTRACTED_CHARS ? text.slice(0, MAX_EXTRACTED_CHARS) + '\n…（已截斷）' : text };
    renderAttachPreview();
    return;
  }
  const mimeType = file.type || { '.pdf': 'application/pdf', '.png': 'image/png', '.jpg': 'image/jpeg', '.jpeg': 'image/jpeg', '.webp': 'image/webp' }[ext];
  if (!['application/pdf', 'image/png', 'image/jpeg', 'image/webp'].includes(mimeType)) { alert('支援圖片（PNG／JPEG／WEBP）、PDF 與文字檔（.txt／.csv／.md）。'); return; }
  const reader = new FileReader();
  reader.onload = () => { pendingAttachment = { kind: 'binary', filename: file.name, mimeType, dataUrl: reader.result }; renderAttachPreview(); };
  reader.onerror = () => alert('讀取檔案失敗，請重試。');
  reader.readAsDataURL(file);
}

function renderAttachPreview() {
  const box = $('attachPreview');
  box.innerHTML = '';
  box.hidden = !pendingAttachment;
  if (!pendingAttachment) return;
  box.appendChild(document.createTextNode('📎 ' + pendingAttachment.filename + ' '));
  const x = el('button', '', '✕');
  x.onclick = () => { pendingAttachment = null; renderAttachPreview(); };
  box.appendChild(x);
}

const inputBox = $('inputBox');
inputBox.addEventListener('input', () => {
  inputBox.style.height = 'auto';
  inputBox.style.height = Math.min(inputBox.scrollHeight, 160) + 'px';
});
inputBox.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey && !e.isComposing) { e.preventDefault(); sendMessage(); }
});

async function resendLastQuery(conv) {
  if (!conv.lastQuery) { renderMessages(); return; }
  await doSend(conv, conv.lastQuery, conv.lastAttachment, lastBotText(conv), false);
}

function lastBotText(conv) {
  for (let i = conv.messages.length - 1; i >= 0; i--) {
    if (conv.messages[i].role === 'bot' && conv.messages[i].text) return conv.messages[i].text;
  }
  return '';
}

async function sendMessage(overrideText) {
  const text = overrideText !== undefined ? overrideText : inputBox.value.trim();
  if (!text || state.isSending) return;
  if (!getAuth()) { showAuthDialog(); return; }
  let conv = getActiveConv();
  if (!conv) { newConversation(); conv = getActiveConv(); }
  const isFirst = conv.messages.length === 0;
  const attachment = pendingAttachment;
  pendingAttachment = null;
  renderAttachPreview();
  const lastAi = lastBotText(conv);
  conv.lastQuery = text;
  conv.lastAttachment = attachment;
  conv.messages.push({ role: 'user', text, time: Date.now(), attachmentName: attachment?.filename });
  if (isFirst) conv.title = text.slice(0, 16);
  if (overrideText === undefined) { inputBox.value = ''; inputBox.style.height = 'auto'; }
  conversations = [conv, ...conversations.filter(c => c !== conv)];
  renderConvSelect();
  toggleAdvisor(true);
  await doSend(conv, text, attachment, lastAi, isFirst);
}

async function doSend(conv, text, attachment, lastAiResponse, isFirst) {
  const botMsg = { role: 'bot', text: '', time: Date.now() };
  conv.messages.push(botMsg);
  renderMessages();
  const box = $('messages');
  const bubble = box.lastElementChild.querySelector('.bubble');
  bubble.textContent = '思考中…';

  const query = attachment?.kind === 'text' ? `${text}\n\n【附加檔案：${attachment.filename}】\n${attachment.extractedText}` : text;
  state.isSending = true;
  $('sendBtn').disabled = true;
  try {
    const res = await fetch(WORKER_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-App-Auth': getAuth() },
      body: JSON.stringify({
        query,
        historySummary: conv.historySummary || '',
        lastAiResponse,
        model: conv.model,
        attachment: attachment?.kind === 'binary' ? attachment : undefined,
        backtestContext: await buildBacktestContext()
      })
    });
    if (res.status === 401) {
      handleUnauthorized();
      throw new Error('密碼錯誤或已失效');
    }
    if (!res.ok) {
      let msg = `HTTP ${res.status}`;
      try { msg = (await res.json()).error || msg; } catch (e) {}
      throw new Error(msg);
    }

    const reader = res.body.getReader();
    const decoder = new TextDecoder('utf-8');
    let buffer = '';
    let acc = '';
    let pending = false;
    let lastRender = 0;
    const scheduleRender = () => {
      if (pending) return;
      pending = true;
      requestAnimationFrame(() => { renderMarkdown(bubble, acc); box.scrollTop = box.scrollHeight; pending = false; });
    };

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop();
      for (const line of lines) {
        const t = line.trim();
        if (!t.startsWith('data: ') || t === 'data: [DONE]') continue;
        try {
          const json = JSON.parse(t.slice(6));
          if (json.type === 'meta') {
            if (json.history_summary) conv.historySummary = json.history_summary;
            botMsg.usedModel = json.used_model || conv.model;
            botMsg.complexity = json.complexity;
            botMsg.taskTag = json.task_tag || '';
            botMsg.summarizerRaw = json.raw_summary || '';
            continue;
          }
          const token = json.choices?.[0]?.delta?.content || '';
          if (token) {
            acc += token;
            botMsg.text = acc;
            const now = Date.now();
            if (now - lastRender >= 80) { lastRender = now; scheduleRender(); }
          }
        } catch (e) {}
      }
    }
    if (!acc) throw new Error('模型沒有回傳內容');
    saveConversations();
    renderMessages();
    if (isFirst) fetchAutoTitle(conv, text, acc);
  } catch (err) {
    conv.messages[conv.messages.length - 1] = { role: 'error', text: '連線失敗：' + err.message, time: Date.now() };
    saveConversations();
    renderMessages();
  } finally {
    state.isSending = false;
    $('sendBtn').disabled = false;
  }
}

function initRebalanceSelect() {

    select.appendChild(o);
  });
  ['rebalance', 'btStart', 'btEnd'].forEach(id => $(id).addEventListener('change', onPortfolioEdited));
}

async function init() {
  renderPlanForm();
  initRebalanceSelect();
  const mq = window.matchMedia('(max-width: 1100px)');
  const syncClose = () => { $('advisorClose').style.display = mq.matches ? '' : 'none'; };
  mq.addEventListener('change', syncClose);
  syncClose();

  const meta = await loadMeta().catch(err => { setStatus('載入資料失敗：' + err.message, true); return null; });
  state.plan = meta ? meta.retirement.normalizePlan(loadJSON(STORE.plan, {})) : loadJSON(STORE.plan, {});
  writePlanForm();
  writePortfolioForm(state.portfolio);

  if (meta) {
    backtestableSymbols(meta).forEach(s => {
      const o = el('option');
      o.value = s;
      o.label = `${meta.manifest.symbols[s]?.name || meta.mapping.etfs[s]?.name || ''}（${earliestDate(meta, s).slice(0, 4)} 起）`;
      $('symbolList').appendChild(o);
    });
    recalc({ markPrevious: false });
  }

  await loadModels().catch(err => {
    console.error('載入模型清單失敗:', err);
    const o = el('option', '', '自動（Worker 未連線）');
    o.value = 'auto';
    $('modelSelect').appendChild(o);
  });
  if (!conversations.length || !getActiveConv()) {
    if (!conversations.length) newConversation();
    else activeId = conversations[0].id;
  }
  renderConvSelect();
  renderMessages();
  if (!getAuth()) showAuthDialog();
}

init();
</script>
</body>
</html>
